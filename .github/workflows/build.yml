name: Build Forge mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.1.1"

      - name: Build mod
        run: gradle --no-daemon build

      - name: Show generated JARs
        run: ls -lah build/libs/

      - name: Upload Forge mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ambient-artillery-1.20.1-forge
          path: build/libs/*-forge-*.jar
          if-no-files-found: error
